<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="theme-color" content="#08080C" />

    <title>ゆきのじょー | High Quality × Entertainment × Engineering</title>
    <meta
      name="description"
      content="SE歴14年、TikTokライバー。ゆきのじょーの配信情報、SNS、制作サービス（TikRing / TikGradation）のリンク集。"
    />

    <!--
      og:url and the absolute form of og:image still need the production
      origin. Set them once the deploy domain is confirmed - some crawlers
      will not resolve a relative og:image.
    -->
    <meta property="og:type" content="profile" />
    <meta property="og:title" content="ゆきのじょー | High Quality × Entertainment × Engineering" />
    <meta
      property="og:description"
      content="SE歴14年、TikTokライバー。1日の始まりと終わりの場所に。"
    />
    <meta property="og:image" content="/images/og-cover.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:locale" content="ja_JP" />
    <meta name="twitter:card" content="summary_large_image" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=Zen+Kaku+Gothic+New:wght@400;500;700;900&display=swap"
      rel="stylesheet"
    />

    <link
      rel="preload"
      as="image"
      href="/images/portrait-768.webp"
      imagesrcset="/images/portrait-480.webp 480w, /images/portrait-768.webp 768w, /images/portrait-1080.webp 1080w"
      imagesizes="(min-width: 1024px) 440px, 208px"
      fetchpriority="high"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
