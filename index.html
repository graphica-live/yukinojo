<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <!-- Matches `paper` in the Tailwind palette, so the browser chrome blends
         into the page rather than framing it. -->
    <meta name="theme-color" content="#F6F9FF" />

    <title>ゆきのじょー | High Quality × Entertainment × Engineering</title>
    <meta
      name="description"
      content="SE歴14年、TikTokライバー。ゆきのじょーの配信情報、SNS、制作サービス（TikRing / TikGradation）のリンク集。"
    />

    <!--
      og:url and the absolute form of og:image still need the production
      origin. Set them once the deploy domain is confirmed - some crawlers
      will not resolve a relative og:image.
    -->
    <meta property="og:type" content="profile" />
    <meta property="og:title" content="ゆきのじょー | High Quality × Entertainment × Engineering" />
    <meta
      property="og:description"
      content="SE歴14年、TikTokライバー。1日の始まりと終わりの場所に。"
    />
    <meta property="og:image" content="/images/og-cover.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:locale" content="ja_JP" />
    <meta name="twitter:card" content="summary_large_image" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!--
      Only the weights the page actually uses:
        Zen Maru Gothic  400 body / 700 bold / 900 display
                         (`font-extrabold` requests 800; with no 800 face the
                         CSS font-matching algorithm resolves it to 900)
        Bricolage Grotesque  700-800, labels and the hero kicker only
        Caveat               400-700, the two handwritten accents
    -->
    <link
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@700..800&family=Caveat:wght@400..700&family=Zen+Maru+Gothic:wght@400;700;900&display=swap"
      rel="stylesheet"
    />

    <!--
      The two characters are the hero's LCP candidates, and the only images on
      the page worth preloading - the decorations are deliberately lazy so they
      never compete for bandwidth.
    -->
    <link rel="preload" as="image" href="/chibi/body.webp" fetchpriority="high" />
    <link rel="preload" as="image" href="/chibi-b/body.webp" fetchpriority="high" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
